<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me</title>
</head>
<body>

  <h1>Contact Me</h1>
  <p>Fill out the form below and I'll get back to you.</p>

  <form action="#" method="post">

    <p>
      <label for="name">Name:</label><br>
      <input type="text" id="name" name="name" required>
    </p>

    <p>
      <label for="email">Email address:</label><br>
      <input type="email" id="email" name="email" required>
    </p>

    <p>Do you accept the terms of agreement?</p>
    <p>
      <input type="radio" id="terms-yes" name="terms" value="yes" required>
      <label for="terms-yes">Yes</label>

      <input type="radio" id="terms-no" name="terms" value="no">
      <label for="terms-no">No</label>
    </p>

    <p>
      <button type="submit">Submit</button>
    </p>

  </form>

</body>
