<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me</title>

  <!-- Bootstrap 5 via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Site style sheet (loaded after Bootstrap so our nav and title styles apply) -->
  <link rel="stylesheet" href="styles.css">

  <!-- Style used by the JavaScript validation to turn a field red -->
  <style>
    .error-red {
      border: 2px solid red !important;
      background-color: #ffd6d6 !important;
    }
    .error-text {
      color: red;
    }
  </style>
</head>
<body class="bg-light">

  <div class="container my-4" style="max-width: 600px;">

    <nav id="main-nav">
      <a class="site-link" href="HomePage.html">Home</a> |
      <a class="site-link" href="Page2.html">Story Summary</a>
    </nav>

    <h1 id="page-title">Contact Me</h1>
    <p class="text-center">Fill out the form below and I'll get back to you.</p>

    <!-- novalidate turns off the browser's built-in popups so our JavaScript handles validation -->
    <form id="contact-form" action="#" method="post" class="card card-body shadow-sm" novalidate>

      <div class="mb-3">
        <label for="name" class="form-label">Name:</label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email address:</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>

      <p class="mb-2" id="terms-question">Do you accept the terms of agreement?</p>
      <div class="mb-3">
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" id="terms-yes" name="terms" value="yes" required>
          <label class="form-check-label" for="terms-yes">Yes</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" id="terms-no" name="terms" value="no">
          <label class="form-check-label" for="terms-no">No</label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Submit</button>

    </form>
  </div>

  <script>
    var form = document.getElementById("contact-form");
    var nameBox = document.getElementById("name");
    var emailBox = document.getElementById("email");
    var termsYes = document.getElementById("terms-yes");
    var termsQuestion = document.getElementById("terms-question");

    // Remove all red highlighting
    function clearErrors() {
      nameBox.classList.remove("error-red");
      emailBox.classList.remove("error-red");
      termsQuestion.classList.remove("error-text");
    }

    form.addEventListener("submit", function (event) {
      clearErrors();

      // 1. Name is required
      if (nameBox.value.trim() === "") {
        event.preventDefault();          // stop the form from submitting
        nameBox.classList.add("error-red");
        nameBox.focus();
        return;
      }

      // 2. Email is required
      if (emailBox.value.trim() === "") {
        event.preventDefault();
        emailBox.classList.add("error-red");
        emailBox.focus();
        return;
      }

      // 3. A terms-of-agreement choice (Yes or No) is required
      var termsChosen = document.querySelector('input[name="terms"]:checked');
      if (termsChosen === null) {
        event.preventDefault();
        termsQuestion.classList.add("error-text");
        termsYes.focus();
        return;
      }
    });

    // Remove the red as soon as the user starts fixing a field
    nameBox.addEventListener("input", function () {
      nameBox.classList.remove("error-red");
    });
    emailBox.addEventListener("input", function () {
      emailBox.classList.remove("error-red");
    });
    document.querySelectorAll('input[name="terms"]').forEach(function (radio) {
      radio.addEventListener("change", function () {
        termsQuestion.classList.remove("error-text");
      });
    });
  </script>

</body>
</html>
