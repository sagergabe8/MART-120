<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me</title>

  <!-- Bootstrap 5 via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Site style sheet (loaded after Bootstrap so our nav and title styles apply) -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

  <div class="container my-4" style="max-width: 600px;">

    <nav id="main-nav">
      <a class="site-link" href="HomePage.html">Home</a> |
      <a class="site-link" href="Page2.html">Story Summary</a>
    </nav>

    <h1 id="page-title">Contact Me</h1>
    <p class="text-center">Fill out the form below and I'll get back to you.</p>

    <form action="#" method="post" class="card card-body shadow-sm">

      <div class="mb-3">
        <label for="name" class="form-label">Name:</label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email address:</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>

      <p class="mb-2">Do you accept the terms of agreement?</p>
      <div class="mb-3">
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" id="terms-yes" name="terms" value="yes" required>
          <label class="form-check-label" for="terms-yes">Yes</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" id="terms-no" name="terms" value="no">
          <label class="form-check-label" for="terms-no">No</label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Submit</button>

    </form>
  </div>

</body>
</html>
